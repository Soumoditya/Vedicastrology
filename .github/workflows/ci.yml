name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The accuracy suite is the important one. It asserts graha longitudes to
      # one arc-second against values generated independently by the Swiss
      # Ephemeris, so a regression in the ayanamsa, node type or time handling
      # fails here rather than shipping a chart that looks plausible but is
      # quietly wrong.
      - name: Astrology accuracy tests
        run: npm test

      - name: Build
        run: npm run build

      # The ephemeris data files are what give full precision. If they ever
      # stop being committed the engine silently drops to its lower-precision
      # fallback, which no test would catch — so their presence is asserted.
      - name: Verify ephemeris data files are present
        run: |
          test -f ephe/sepl_18.se1 || { echo "Missing ephe/sepl_18.se1"; exit 1; }
          test -f ephe/semo_18.se1 || { echo "Missing ephe/semo_18.se1"; exit 1; }
          echo "Ephemeris data files present."
